# Values for the murmur hub. README.md in this folder walks through an install; docs/configuration.md lists
# every setting the hub reads.

# More than one replica needs a networked store and bus (see store and bus below). The chart refuses otherwise.
replicaCount: 1

image:
  repository: ghcr.io/eledoneai/murmur-hub
  # Empty means the chart's appVersion. Pin a release, for example "1.0.0".
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# The address people and laptops use, for example https://murmur.example.com. Required.
publicURL: ""

# Where the hub keeps its data. Empty: the image's default, sqlite on the persistent volume below, for one replica.
# Otherwise postgres://... or firestore://PROJECT[/DATABASE]. Put a password in existingSecret and refer to it as
# $(KEY), for example postgres://murmur:$(POSTGRES_PASSWORD)@postgres:5432/murmur
store: ""

# How hub replicas tell each other about events. Empty: local://, for one replica.
# Otherwise postgres://..., redis://... or rediss://..., with passwords as $(KEY) like store.
# Unless store is a Postgres or Firestore URL and bus a Postgres or Redis URL, upgrades use the Recreate strategy:
# the old pod stops before the new one starts.
bus: ""

# The name of an existing Secret in the release's namespace. Each of its keys becomes an environment variable of the
# hub. Put SESSION_SECRET (required), the identity provider's client secret (OIDC_CLIENT_SECRET,
# GOOGLE_CLIENT_SECRET or GITHUB_CLIENT_SECRET) and any password store or bus refer to in it.
existingSecret: ""

# Every other setting, as plain environment variables: the identity provider, who may join, the first admins,
# LOG_FORMAT, TOKEN_DAYS. Every replica gets the same values, so leave INSTANCE_ID out. Without OIDC_ISSUER,
# GOOGLE_CLIENT_ID or GITHUB_CLIENT_ID (here or in existingSecret) the hub refuses to start. For example:
#   OIDC_ISSUER: https://login.example.com
#   OIDC_CLIENT_ID: murmur
#   OIDC_NAME: Example SSO
#   ALLOWED_DOMAINS: example.com
#   ADMINS: you@example.com
env: {}

# The volume for the sqlite store. Used only when store is empty or sqlite:// and replicaCount is 1. Keep it with the
# -litestream image: without it, /data is an emptyDir, and a pod replacing an evicted one could write next to it.
persistence:
  enabled: true
  size: 1Gi
  storageClass: ""
  # ReadWriteOncePod, with a CSI storage class, keeps even two pods on one node from sharing the volume.
  accessMode: ReadWriteOnce
  # Use a claim you created yourself instead of letting the chart create one.
  existingClaim: ""

serviceAccount:
  create: true
  name: ""
  # For example the Workload Identity annotation, when the hub uses Firestore on GKE.
  annotations: {}

service:
  type: ClusterIP
  port: 80

# Each laptop holds one WebSocket open for as long as it is connected. Laptops and the hub ping each other every
# 25 seconds, so any idle timeout of a minute or more works. What cuts laptops off is a limit on how long a whole
# request may last: README.md says what to set for each controller and gateway.

ingress:
  enabled: false
  # Your controller's IngressClass, for example traefik. Empty means the cluster's default class.
  className: ""
  # Annotations for your controller, for example a cert-manager issuer. ingress-nginx, archived in March 2026, works
  # with its defaults; these leave a margin on its timeouts:
  #   nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
  #   nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  annotations: {}
  # Empty means the host of publicURL.
  host: ""
  tls: []
  #  - secretName: murmur-tls
  #    hosts:
  #      - murmur.example.com

# A Gateway API HTTPRoute that attaches the hub to a Gateway you already run, instead of an Ingress.
httpRoute:
  enabled: false
  # The Gateway, and optionally its listener, to attach to. Required when enabled. For example:
  #   - name: public
  #     namespace: gateway-system
  #     sectionName: https
  parentRefs: []
  # Empty means the host of publicURL.
  hostnames: []
  # The rule's timeouts. Never set a request or backendRequest timeout: it ends every laptop's WebSocket when it
  # reaches that age. If your implementation applies one by default, turn it off with request: 0s.
  timeouts: {}
  annotations: {}
  labels: {}

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  # makes the volume writable by the hub
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}
