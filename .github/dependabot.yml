version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The hub's web pages: their build tools, which pull in most of these packages, never ship in the hub.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]
    ignore:
      # astro check refuses TypeScript 7 (it says to stay on 6): take 7 once Astro checks with it
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  # The base images of the hub, pinned by digest in deploy/docker. The Go version comes from go.mod.
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule:
      interval: weekly
